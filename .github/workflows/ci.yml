name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run tests (offline, mock provider only -- no secrets required)
        run: pytest -q --cov=alef --cov-report=term-missing

      - name: Smoke-test the CLI end to end
        run: |
          python scripts/run_experiment.py --provider mock \
            --payloads alef/data/sample_payloads.jsonl --out runs/ci_smoke.jsonl
          python scripts/analyze_results.py --runs runs/ci_smoke.jsonl --out reports/
