[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alef-audit"
version = "0.1.0"
description = "Action-Level Evaluation Framework (ALEF) for indirect prompt injection in multi-step LLM web agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Jannatul Ferdous Katha" },
  { name = "Tasmia Tahmid Prova" },
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "click>=8.1",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.30"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[tool.setuptools.packages.find]
include = ["alef*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
